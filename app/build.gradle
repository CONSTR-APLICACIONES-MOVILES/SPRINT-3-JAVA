plugins {
    alias(libs.plugins.android.application)
}

// debug talks to the local firebase emulators, pass -PfirebaseEmulatorHost=127.0.0.1 when you use adb reverse
def firebaseEmulatorHost = project.findProperty("firebaseEmulatorHost") ?: "10.0.2.2"

// with app/google-services.json (from the firebase console, never in the repo) the app uses the real firebase project;
// without it debug uses the local emulators. -PuseFirebaseEmulators=true forces the emulators
def hasGoogleServices = file('google-services.json').exists()
def useEmulators = project.hasProperty('useFirebaseEmulators') ? project.property('useFirebaseEmulators').toBoolean() : !hasGoogleServices
if (hasGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.example.parchapp'
    buildFeatures {
        buildConfig true
    }
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.parchapp"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "USE_FIREBASE_EMULATORS", "${useEmulators}"
            buildConfigField "String", "FIREBASE_EMULATOR_HOST", "\"${firebaseEmulatorHost}\""
        }
        release {
            buildConfigField "boolean", "USE_FIREBASE_EMULATORS", "false"
            buildConfigField "String", "FIREBASE_EMULATOR_HOST", '"127.0.0.1"'
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation libs.play.services.auth
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
